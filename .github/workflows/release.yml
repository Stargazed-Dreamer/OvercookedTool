name: Release Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: 构建并打包发布物 (windows-latest)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK 9.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 还原依赖
        run: dotnet restore OvercookedTool.sln

      - name: 构建 Release
        run: dotnet build OvercookedTool.sln -c Release --no-restore

      # 复用 #create-package.bat 的打包逻辑（CI 中直接用 PowerShell 复制文件）
      - name: 打包到 OvercookedSaveTool-Package
        shell: pwsh
        run: |
          $release = 'OvercookedTool.App/bin/Release/net9.0-windows'
          $pkg = 'OvercookedSaveTool-Package'
          if (-not (Test-Path "$release/OvercookedTool.App.exe")) {
            throw "未找到 Release 产物: $release/OvercookedTool.App.exe"
          }
          if (Test-Path $pkg) { Remove-Item -Recurse -Force $pkg }
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          # 主程序与托管程序集
          Copy-Item "$release/OvercookedTool.App.exe" $pkg
          Copy-Item "$release/OvercookedTool.App.dll" $pkg
          Copy-Item "$release/OvercookedTool.Core.dll" $pkg
          Copy-Item "$release/libcoffee.dll" $pkg
          # 配置文件
          Copy-Item "$release/save_display_config.json" $pkg
          # 运行时配置
          Copy-Item "$release/OvercookedTool.App.runtimeconfig.json" $pkg
          Copy-Item "$release/OvercookedTool.App.deps.json" $pkg
          # Unity 设备标识测试工具
          Copy-Item "$release/UnityHarness" $pkg -Recurse -Force

          # 验证关键文件
          if (-not (Test-Path "$pkg/OvercookedTool.App.exe")) { throw "打包缺失: OvercookedTool.App.exe" }
          if (-not (Test-Path "$pkg/OvercookedTool.Core.dll")) { throw "打包缺失: OvercookedTool.Core.dll" }

          Write-Host "打包完成，目录内容:"
          Get-ChildItem $pkg | ForEach-Object { Write-Host " - $($_.Name)" }

      - name: 上传打包构件
        uses: actions/upload-artifact@v4
        with:
          name: OvercookedSaveTool-Package
          path: OvercookedSaveTool-Package/
          if-no-files-found: error
